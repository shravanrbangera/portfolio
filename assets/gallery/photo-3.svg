<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="eventGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1726" />
      <stop offset="50%" stop-color="#122033" />
      <stop offset="85%" stop-color="#1264A3" />
      <stop offset="100%" stop-color="#28A9E8" />
    </linearGradient>
    <radialGradient id="stageSpotlight" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#18AFA0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B1726" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#eventGrad)" />
  <circle cx="360" cy="160" r="450" fill="url(#stageSpotlight)" />

  <!-- Stage Light Beams & Event Rays -->
  <polygon points="360,160 0,800 200,800" fill="#28A9E8" opacity="0.25" />
  <polygon points="360,160 300,800 650,800" fill="#18AFA0" opacity="0.3" />
  <polygon points="360,160 750,800 1100,800" fill="#36B37E" opacity="0.2" />

  <!-- Motion Trails / Reel Particles -->
  <g opacity="0.6">
    <circle cx="200" cy="400" r="6" fill="#FFFFFF" />
    <circle cx="350" cy="300" r="10" fill="#28A9E8" />
    <circle cx="480" cy="520" r="8" fill="#18AFA0" />
    <circle cx="700" cy="380" r="14" fill="#FFFFFF" />
    <circle cx="850" cy="260" r="9" fill="#36B37E" />
    <circle cx="980" cy="480" r="7" fill="#28A9E8" />
  </g>

  <!-- Lens Aperture Symbolism -->
  <polygon points="600,280 720,350 720,490 600,560 480,490 480,350" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="4" />
  <circle cx="600" cy="420" r="60" fill="none" stroke="#28A9E8" stroke-width="3" stroke-dasharray="10 5" />

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" rx="16" />

  <g transform="translate(70, 710)">
    <text font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" letter-spacing="3" opacity="0.95">AGON 2024 • 2ND PLACE WINNER</text>
    <text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#28A9E8" y="24" letter-spacing="1.5">Stage Photography &amp; Reel Motion Narrative</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1726" />
      <stop offset="40%" stop-color="#1264A3" />
      <stop offset="75%" stop-color="#18AFA0" />
      <stop offset="100%" stop-color="#36B37E" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#28A9E8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1264A3" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />
  <circle cx="840" cy="240" r="300" fill="url(#sunGlow)" />

  <!-- Abstract Architectural Geometry (Golden Hour Framing) -->
  <g opacity="0.85">
    <!-- Pillar 1 -->
    <polygon points="100,800 280,300 420,300 320,800" fill="#0B1726" opacity="0.9" />
    <!-- Pillar 2 -->
    <polygon points="350,800 500,200 640,200 520,800" fill="#122033" opacity="0.75" />
    <!-- Diagonal Glass Arch -->
    <polygon points="0,200 1200,650 1200,800 0,350" fill="url(#glassReflection)" />
    <!-- Light Ray Lines -->
    <line x1="840" y1="240" x2="100" y2="800" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
    <line x1="840" y1="240" x2="300" y2="800" stroke="#28A9E8" stroke-opacity="0.35" stroke-width="3" />
    <line x1="840" y1="240" x2="550" y2="800" stroke="#18AFA0" stroke-opacity="0.3" stroke-width="2" />
    <line x1="840" y1="240" x2="900" y2="800" stroke="#36B37E" stroke-opacity="0.2" stroke-width="1.5" />
  </g>

  <!-- Floating Glass Particles / Bokeh -->
  <circle cx="450" cy="350" r="45" fill="#FFFFFF" opacity="0.15" filter="url(#blurFilter)" />
  <circle cx="720" cy="280" r="70" fill="#28A9E8" opacity="0.25" filter="url(#blurFilter)" />
  <circle cx="900" cy="480" r="90" fill="#18AFA0" opacity="0.2" filter="url(#blurFilter)" />

  <!-- Frame Overlay Details -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" rx="16" />

  <!-- Photographer Watermark Tag -->
  <g transform="translate(70, 710)">
    <text font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" letter-spacing="3" opacity="0.95">ETTIN 2025 • 1ST PLACE WINNER</text>
    <text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#28A9E8" y="24" letter-spacing="1.5">Architectural Geometry &amp; Perspective</text>
  </g>
</svg>

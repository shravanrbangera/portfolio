<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="macroGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1726" />
      <stop offset="35%" stop-color="#18AFA0" />
      <stop offset="70%" stop-color="#36B37E" />
      <stop offset="100%" stop-color="#F7FBFC" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#macroGrad)" />

  <!-- Macro Leaf Blade / Prism Wave -->
  <path d="M-100 800 C 400 600, 500 200, 1300 0 L 1300 800 Z" fill="#0B1726" opacity="0.6" />
  <path d="M-100 800 C 300 500, 600 300, 1300 100" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4" fill="none" />
  <path d="M-100 800 C 350 550, 650 350, 1300 150" stroke="#36B37E" stroke-opacity="0.7" stroke-width="3" fill="none" />

  <!-- Light Prism Drops -->
  <circle cx="450" cy="450" r="16" fill="#FFFFFF" opacity="0.8" />
  <circle cx="620" cy="360" r="22" fill="#28A9E8" opacity="0.85" />
  <circle cx="780" cy="270" r="12" fill="#FFFFFF" opacity="0.9" />

  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" rx="16" />

  <g transform="translate(70, 710)">
    <text font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" letter-spacing="3" opacity="0.95">VISUAL STORYTELLING</text>
    <text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#36B37E" y="24" letter-spacing="1.5">Macro Textures &amp; Natural Prisms</text>
  </g>
</svg>

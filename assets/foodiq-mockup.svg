<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1726" />
      <stop offset="50%" stop-color="#122033" />
      <stop offset="100%" stop-color="#1264A3" />
    </linearGradient>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28A9E8" />
      <stop offset="50%" stop-color="#18AFA0" />
      <stop offset="100%" stop-color="#36B37E" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" rx="24" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="130" x2="1000" y2="130" />
    <line x1="0" y1="260" x2="1000" y2="260" />
    <line x1="0" y1="390" x2="1000" y2="390" />
    <line x1="0" y1="520" x2="1000" y2="520" />
    <line x1="200" y1="0" x2="200" y2="650" />
    <line x1="400" y1="0" x2="400" y2="650" />
    <line x1="600" y1="0" x2="600" y2="650" />
    <line x1="800" y1="0" x2="800" y2="650" />
  </g>

  <!-- Main Scanner Frame (Center-Left) -->
  <rect x="60" y="80" width="480" height="490" rx="20" fill="url(#cardGlass)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Scanning Reticle -->
  <rect x="120" y="140" width="360" height="300" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="16 8" />
  <path d="M120 180 L120 140 L160 140" stroke="#36B37E" stroke-width="4" fill="none" />
  <path d="M440 140 L480 140 L480 180" stroke="#36B37E" stroke-width="4" fill="none" />
  <path d="M120 400 L120 440 L160 440" stroke="#36B37E" stroke-width="4" fill="none" />
  <path d="M440 440 L480 440 L480 400" stroke="#36B37E" stroke-width="4" fill="none" />

  <!-- Scan Beam Line -->
  <line x1="120" y1="280" x2="480" y2="280" stroke="#28A9E8" stroke-width="3" opacity="0.8" />

  <!-- Recognized Label Tag -->
  <rect x="180" y="470" width="240" height="46" rx="23" fill="#18AFA0" opacity="0.9" />
  <text x="300" y="498" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">AVOCADO SALAD • 98.4%</text>

  <!-- Right Analysis Panel -->
  <rect x="570" y="80" width="370" height="490" rx="20" fill="url(#cardGlass)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- App Header -->
  <text x="610" y="130" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">FoodIQ AI Insights</text>
  <text x="610" y="155" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#28A9E8">Deep Learning Nutrition Scanner</text>

  <!-- Stats Metric Cards -->
  <!-- Calories -->
  <rect x="610" y="185" width="290" height="75" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" />
  <text x="630" y="218" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#18AFA0">CALORIES</text>
  <text x="630" y="246" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">320 kcal</text>

  <!-- Protein & Carbs Grid -->
  <rect x="610" y="275" width="138" height="75" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" />
  <text x="625" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#28A9E8">PROTEIN</text>
  <text x="625" y="333" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">12.5g</text>

  <rect x="762" y="275" width="138" height="75" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" />
  <text x="777" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#36B37E">CARBS</text>
  <text x="777" y="333" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">24.0g</text>

  <!-- Health Score Gauge -->
  <rect x="610" y="365" width="290" height="90" rx="14" fill="url(#accentGrad)" fill-opacity="0.15" stroke="url(#accentGrad)" stroke-width="1.5" />
  <text x="630" y="398" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">HEALTH INDEX SCORE</text>
  <text x="630" y="435" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#36B37E">92 <tspan font-size="16" font-weight="500" fill="#FFFFFF">/ 100</tspan></text>

  <!-- Dataset tag -->
  <text x="610" y="525" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" opacity="0.6">Trained on 148,000+ food dataset images</text>
</svg>
